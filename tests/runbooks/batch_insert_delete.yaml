# Scaled-down copy (x0.02) of CANDOR-Bench runbooks/deletion_patterns/batch_delete_0.1.yaml, dataset 'sift', for mock tests.
test:
  max_pts: 20000
  1:
    operation: startHPC
  2:
    operation: initial
    start: 0
    end: 1000
  3:
    operation: batch_insert_delete
    start: 1000
    end: 20000
    batchSize: 50
    eventRate: 10000
    deletion_percentage: 0.1
  4:
    operation: waitPending
  5:
    operation: search
  6:
    operation: endHPC
